<svg viewBox="0 0 900 680" role="img" aria-label="The three questions, the evidence for each, and what it leaves unproved" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="arrow"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="arrow brand"/></marker></defs>
<rect class="lane" x="16" y="16" width="520" height="620"/>
<text class="lane-title" x="30" y="40">Evidence</text>
<text class="lane-sub" x="30" y="58">these do not substitute for one another</text>
<rect class="lane" x="556" y="16" width="328" height="620"/>
<text class="lane-title" x="570" y="40">Left unproved</text>
<path class="edge dashed" d="M 516 172.0 C 546.0 172.0 546.0 172.0 576 172.0" marker-end="url(#arrow)"/>
<path class="edge dashed" d="M 516 339.0 C 546.0 339.0 546.0 339.0 576 339.0" marker-end="url(#arrow)"/>
<path class="edge dashed" d="M 516 429.0 C 546.0 429.0 546.0 429.0 576 429.0" marker-end="url(#arrow)"/>
<path class="edge dashed" d="M 516 600.5 C 546.0 600.5 546.0 600.5 576 600.5" marker-end="url(#arrow)"/>
<g class="node tone-purple">
<rect x="36" y="62" width="480" height="57"/>
<text class="n-title" x="48" y="83">1. Does it preserve macOS?</text>
<text class="n-sub" x="48" y="102">the expensive failure</text>
</g>
<g class="node tone-orange">
<rect x="36" y="135" width="480" height="74"/>
<text class="n-title" x="48" y="156">Engine and app tests, by hand</text>
<text class="n-sub" x="48" y="175">~3,800 lines over 9 engine modules,</text>
<text class="n-sub" x="48" y="192">38 Swift files. Simulated disks only</text>
</g>
<g class="node tone-ext">
<rect x="576" y="135" width="300" height="74"/>
<text class="n-title" x="588" y="156">A real APFS resize</text>
<text class="n-sub" x="588" y="175">both VM harnesses start</text>
<text class="n-sub" x="588" y="192">from a blank disk</text>
</g>
<g class="node tone-purple">
<rect x="36" y="229" width="480" height="57"/>
<text class="n-title" x="48" y="250">2. Does the system work?</text>
<text class="n-sub" x="48" y="269">most of the automation is here</text>
</g>
<g class="node tone-blue">
<rect x="36" y="302" width="480" height="74"/>
<text class="n-title" x="48" y="323">Source tests, every change</text>
<text class="n-sub" x="48" y="342">315 shell files, the router suite,</text>
<text class="n-sub" x="48" y="359">4 CI shards. Fixtures, not a machine</text>
</g>
<g class="node tone-ext">
<rect x="576" y="302" width="300" height="74"/>
<text class="n-title" x="588" y="323">An installed system</text>
<text class="n-sub" x="588" y="342">and runtime probes skip</text>
<text class="n-sub" x="588" y="359">when headless</text>
</g>
<g class="node tone-blue">
<rect x="36" y="392" width="480" height="74"/>
<text class="n-title" x="48" y="413">VM acceptance, every release</text>
<text class="n-sub" x="48" y="432">fresh install: interrupt, resume,</text>
<text class="n-sub" x="48" y="449">reboot, verify. Image: 3 boots</text>
</g>
<g class="node tone-ext">
<rect x="576" y="392" width="300" height="74"/>
<text class="n-title" x="588" y="413">The kernel you boot</text>
<text class="n-sub" x="588" y="432">Aurora cannot run on QEMU,</text>
<text class="n-sub" x="588" y="449">so a generic kernel stands in</text>
</g>
<g class="node tone-orange">
<rect x="36" y="482" width="480" height="74"/>
<text class="n-title" x="48" y="503">Graphical acceptance, by hand</text>
<text class="n-sub" x="48" y="522">8 tests in a live session,</text>
<text class="n-sub" x="48" y="539">in a disposable VM. Never in CI</text>
</g>
<g class="node tone-purple">
<rect x="36" y="572" width="480" height="57"/>
<text class="n-title" x="48" y="593">3. Does it work on your Mac?</text>
<text class="n-sub" x="48" y="612">a person at a real Mac, cold booted</text>
</g>
<g class="node tone-ext">
<rect x="576" y="572" width="300" height="57"/>
<text class="n-title" x="588" y="593">Every Mac</text>
<text class="n-sub" x="588" y="612">two machines in the lab</text>
</g>
<g class="node tone-purple"><rect x="16" y="655" width="14" height="14"/></g>
<text class="legend" x="36" y="666">the question</text>
<g class="node tone-blue"><rect x="154.0" y="655" width="14" height="14"/></g>
<text class="legend" x="174.0" y="666">automated</text>
<g class="node tone-orange"><rect x="269.5" y="655" width="14" height="14"/></g>
<text class="legend" x="289.5" y="666">run by hand</text>
<g class="node tone-ext"><rect x="400.0" y="655" width="14" height="14"/></g>
<text class="legend" x="420.0" y="666">the gap it leaves</text>
</svg>
