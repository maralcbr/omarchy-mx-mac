name: Docs site

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "markdown==3.7"
      - name: Diagrams match their generator
        run: |
          python3 docs/site/diagrams/gen.py
          # --exit-code alone misses a diagram the generator newly produced,
          # because an untracked file is not a diff.
          if [ -n "$(git status --porcelain -- docs/site/diagrams)" ]; then
            echo "docs/site/diagrams is out of date; run docs/site/diagrams/gen.py and commit"
            git status --porcelain -- docs/site/diagrams
            exit 1
          fi
      - run: python3 docs/site/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
