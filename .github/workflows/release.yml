name: Publish stable Mac release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable vX.Y.Z-mac.N tag
        required: true
      sequence:
        description: Monotonically increasing release sequence
        required: true

concurrency:
  group: stable-mac-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    environment: stable-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Install test and signing tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck gnupg
      - name: Run source tests
        run: |
          bash test/omarchy-cli-test.sh
          bash tests/test-asahi-compatibility.sh
          bash tests/stable-release-test.sh
      - name: Validate release inputs
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SEQUENCE: ${{ inputs.sequence }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ $RELEASE_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+-mac\.[0-9]+$ ]]
          [[ $RELEASE_SEQUENCE =~ ^[1-9][0-9]*$ ]]
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          latest_tag=$(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-mac\.[0-9]+$' | sort -V | tail -1)
          [[ -z $latest_tag || $(printf '%s\n%s\n' "$latest_tag" "$RELEASE_TAG" | sort -V | tail -1) == "$RELEASE_TAG" && $latest_tag != "$RELEASE_TAG" ]]
      - name: Import release key
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.OMARCHY_RELEASE_PRIVATE_KEY }}
        run: printf '%s' "$RELEASE_PRIVATE_KEY" | gpg --batch --import
      - name: Build signed release assets
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          OMARCHY_RELEASE_SEQUENCE: ${{ inputs.sequence }}
          OMARCHY_RELEASE_SIGNING_KEY: 40DFB630FF42BCFFB047046CF0134EE680CAC571
        run: scripts/build-stable-release "$RELEASE_TAG"
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" dist/stable-release/* --verify-tag --title "Omarchy MX Mac ${RELEASE_TAG#v}" --generate-notes
