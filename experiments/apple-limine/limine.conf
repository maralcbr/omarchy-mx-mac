# Omarchy Limine configuration for Apple Silicon (experiment, M1 Pro only).
# Booted by U-Boot's EFI boot manager as /EFI/BOOT/BOOTAA64.EFI on the ESP.
# Limine reads FAT only, so the kernel and initramfs are copies on the ESP
# under /omarchy/ (kept in step with /boot by the deploy script). The
# firmware (U-Boot) device tree is passed through.
timeout: 3
default_entry: 1
interface_branding: Omarchy Bootloader
interface_branding_color: 9ece6a
interface_help_color: 9ece6a
interface_help_color_bright: 9ece6a
hash_mismatch_panic: no

term_background: 1a1b26
backdrop: 1a1b26
term_palette: 15161e;f7768e;9ece6a;e0af68;7aa2f7;bb9af7;7dcfff;a9b1d6
term_palette_bright: 414868;f7768e;9ece6a;e0af68;7aa2f7;bb9af7;7dcfff;c0caf5
term_foreground: c0caf5
term_foreground_bright: c0caf5
term_background_bright: 24283b
term_font_scale: 2x2

/Omarchy Linux
    protocol: linux
    path: boot():/omarchy/vmlinuz-linux-aurora
    module_path: boot():/omarchy/initramfs-linux-aurora.img
    cmdline: @@CMDLINE@@

/GRUB (previous bootloader)
    protocol: efi_chainload
    path: boot():/EFI/BOOT/grub-aa64.efi
