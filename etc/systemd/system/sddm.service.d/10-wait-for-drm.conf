# On Apple Silicon the boot framebuffer (simpledrm) registers a DRM card 0.1s
# into boot, but the Apple display controller only takes over around three
# seconds later. A greeter compositor that starts in between binds its output
# to simpledrm's generic "Unknown-1" connector, and once apple-drm replaces
# simpledrm the greeter is left rendering to an output that no longer scans
# out. The panel keeps showing the last frame it drew, so the password field
# never fills in even though typing still reaches it and Enter authenticates.
#
# Machines without that controller have no such gap and must not be delayed,
# so key off the device-tree node, which exists from boot. Connectors are not
# a usable test: simpledrm has one, and so does the GPU's own card.
[Service]
ExecStartPre=/usr/bin/bash -c '[ -e /proc/device-tree/soc/display-subsystem ] || exit 0; for _ in {1..200}; do [ -e /dev/dri/by-path/platform-soc:display-subsystem-card ] && break; sleep 0.05; done; exit 0'
